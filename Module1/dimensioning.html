<!-- Boot diagnostic: turns a blank page into an actionable message. Self-removed by the engine on success. -->
<script>
(function(){
  function overlay(title, detail){
    if(document.getElementById('boot-error')) return;
    var add=function(){
      var d=document.createElement('div'); d.id='boot-error'; d.setAttribute('role','alert');
      d.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:#efebe1;font-family:system-ui,sans-serif';
      d.innerHTML='<div style="max-width:560px;border:1px solid #d9d2c3;border-radius:10px;padding:24px 28px;background:#faf8f3;color:#221f18">'
        +'<h1 style="margin:0 0 10px;font-size:18px;font-weight:700">'+title+'</h1>'
        +'<div style="font-size:14px;line-height:1.65;color:#564e3c">'+detail+'</div></div>';
      document.body.appendChild(d);
    };
    if(document.body) add(); else window.addEventListener('DOMContentLoaded',add);
  }
  function code(s){return '<code style="background:#efebe1;padding:2px 5px;border-radius:4px">'+s+'</code>';}
  window.addEventListener('error',function(e){
    overlay('The lesson hit an error', code((e&&e.message)||'Unknown error')+'<br><br>Open the browser console (F12 → Console) and share the first red error.');
  });
  window.addEventListener('unhandledrejection',function(e){
    overlay('The lesson hit an error', code((e&&e.reason)||'Unhandled promise rejection'));
  });
  setTimeout(function(){
    if(window.__simStarted) return;
    if(location.protocol==='file:'){
      overlay('Open this through a web server, not a file',
        'This page is open as a '+code('file://')+' URL, which browsers block from loading ES modules, so nothing runs and the page stays blank.<br><br>'
        +'Serve the folder over HTTP instead. With XAMPP started, open:<br><br>'+code('http://localhost/Simatrix/Module1/'));
    } else {
      overlay('The lesson didn’t finish loading',
        'The page loaded but the 3D module didn’t initialise.<br><br>'
        +'• It needs internet on first load (Three.js loads from a CDN).<br>'
        +'• Open the console (F12) and share the first red error.');
    }
  }, 6000);
})();
</script>

<!-- Page-specific tweak (allowed by the shared-frame plan): the dimension-system
     segmented toggle + the mini-challenge options/feedback. All colours come from the
     design tokens — success (green) for correct, vp-line (clay) for incorrect, each
     paired with a ✓/✗ glyph (Two-Cue rule). -->
<style>
  .seg{display:flex;gap:var(--space-2);margin-top:var(--space-2)}
  .seg-btn{flex:1;min-height:40px;padding:0 var(--space-3);font:inherit;font-size:.875rem;
    color:var(--color-ink);background:var(--color-paper);border:1px solid var(--color-border);
    border-radius:var(--radius-sm);cursor:pointer;transition:border-color var(--dur-fast) var(--ease-standard),background var(--dur-fast) var(--ease-standard)}
  .seg-btn:hover{border-color:var(--color-accent)}
  .seg-btn.on{color:var(--color-paper);background:var(--color-accent);border-color:var(--color-accent)}
  .seg-btn:focus-visible{outline:none;box-shadow:var(--ring-focus)}

  .challenge-options{display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-2)}
  .challenge-opt{display:flex;align-items:center;gap:var(--space-3);text-align:left;
    padding:var(--space-3);font:inherit;font-size:.875rem;color:var(--color-ink);
    background:var(--color-paper);border:1px solid var(--color-border);
    border-radius:var(--radius-sm);cursor:pointer;
    transition:border-color var(--dur-fast) var(--ease-standard),background var(--dur-fast) var(--ease-standard)}
  .challenge-opt:hover{border-color:var(--color-accent)}
  .challenge-opt:focus-visible{outline:none;box-shadow:var(--ring-focus)}
  .challenge-opt .opt-tag{flex:none;font-weight:700;font-size:.6875rem;letter-spacing:.04em;
    text-transform:uppercase;color:var(--color-ink-secondary)}
  .challenge-opt.correct{border-color:var(--color-success);background:var(--color-success-soft)}
  .challenge-opt.correct .opt-tag{color:var(--color-success)}
  .challenge-opt.incorrect{border-color:var(--color-vp-line);
    background:color-mix(in srgb,var(--color-vp-line) 9%,transparent)}
  .challenge-opt.incorrect .opt-tag{color:var(--color-vp-line)}

  .challenge-feedback{display:none;margin-top:var(--space-3);padding:var(--space-3);
    font-size:.8125rem;line-height:1.55;border-radius:var(--radius-sm);border:1px solid var(--color-border)}
  .challenge-feedback.show{display:block}
  .challenge-feedback.ok{background:var(--color-success-soft);border-color:var(--color-success)}
  .challenge-feedback.bad{background:color-mix(in srgb,var(--color-vp-line) 8%,transparent);border-color:var(--color-vp-line)}
  .challenge-feedback strong{font-weight:700}
</style>
</head>

<aside id="wizard">
  <a class="brand" href="./index.html">Simatrix <span>·</span> Dimensioning</a>

  <nav class="chapnav" aria-label="Chapters">
    <a href="./index.html" class="chap">Planes</a>

    <a href="./dimensioning.html" class="chap on" aria-current="page">Dimensioning</a>

    <a href="./lines.html" class="chap">Lines</a>
  </nav>

  <div class="wizard-main">
  <section class="step-card" id="step-card" aria-live="off">
    <p class="eyebrow" id="eyebrow">Step 1 of 4</p>
    <h1 class="step-title" id="step-title">Three parts of a dimension</h1>
    <p class="step-lead" id="step-lead"></p>
    <div class="step-body" id="step-body"></div>

    <!-- Static control wrappers; the engine shows only those the step needs -->
    <div class="controls" id="controls">
      <div class="ctrl" data-ctrl="dimmode" hidden>
        <span class="ctrl-label">Dimension system</span>
        <div class="seg" role="group" aria-label="Dimension system">
          <button id="tg-aligned" class="seg-btn on" type="button" aria-pressed="true">Aligned</button>
          <button id="tg-uni" class="seg-btn" type="button" aria-pressed="false">Unidirectional</button>
        </div>
      </div>

      <div class="ctrl" data-ctrl="challenge" hidden>
        <span class="ctrl-label">Which placement is correct?</span>
        <div class="challenge-options">
          <button id="opt-a" class="challenge-opt" type="button">
            <span class="opt-tag">Option A</span> Dimension outside the object
          </button>
          <button id="opt-b" class="challenge-opt" type="button">
            <span class="opt-tag">Option B</span> Dimension through the body
          </button>
        </div>
        <div class="challenge-feedback" id="challenge-feedback" role="status" aria-live="polite"></div>
      </div>
    </div>

    <div class="hint" id="hint" hidden>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
      <span id="hint-text"></span>
    </div>

    <footer class="card__nav">
      <div id="reset-control">
        <button id="btn-reset" class="btn btn--ghost" type="button">Reset</button>
      </div>
      <button id="btn-back" class="btn btn-secondary btn--nav" type="button">Back</button>
      <button id="btn-next" class="btn btn--primary btn--nav" type="button">Next</button>
    </footer>
  </section>

  <ol id="step-rail" aria-label="Lesson steps"></ol>
  </div>
</aside>

<!-- ════════ VIEWPORT (single 3D window) ════════ -->
<div id="sim-viewport">
  <div id="canvas-area">
    <canvas id="c3d" role="img" aria-label="3D view of a machine part used to teach dimensioning. The step instructions and the text summary below describe what to look at."></canvas>
  </div>
  <!-- Mirrors the viewport's computed result as text for assistive tech. -->
  <div id="vp-status" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
</div>

<!-- Inline term popover -->
<div id="term-pop" role="tooltip"></div>

<!-- Mobile notice -->
<div id="mobile-note" role="note">
  <span>The 3D view stays pinned at the top while you scroll through the steps. Drag it to orbit the dimensioned part.</span>
  <button id="mobile-dismiss" class="btn btn-secondary" style="padding:0 var(--space-4)">Got it</button>
</div>

<!-- Live region: announces step changes -->
<div id="live" class="sr" role="status" aria-live="polite"></div>

<script type="module" src="./dimensioning.js"></script>
