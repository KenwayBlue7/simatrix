<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light only"/>
<title>Projection of Points · Simatrix</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<!-- Boot diagnostic: turns a blank page into an actionable message. Self-removed by the engine on success. -->
<script>
(function(){
  function overlay(title, detail){
    if(document.getElementById('boot-error')) return;
    var add=function(){
      var d=document.createElement('div'); d.id='boot-error'; d.setAttribute('role','alert');
      d.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:#efebe1;font-family:system-ui,sans-serif';
      d.innerHTML='<div style="max-width:560px;border:1px solid #d9d2c3;border-radius:10px;padding:24px 28px;background:#faf8f3;color:#221f18">'
        +'<h1 style="margin:0 0 10px;font-size:18px;font-weight:700">'+title+'</h1>'
        +'<div style="font-size:14px;line-height:1.65;color:#564e3c">'+detail+'</div></div>';
      document.body.appendChild(d);
    };
    if(document.body) add(); else window.addEventListener('DOMContentLoaded',add);
  }
  function code(s){return '<code style="background:#efebe1;padding:2px 5px;border-radius:4px">'+s+'</code>';}
  window.addEventListener('error',function(e){
    overlay('The simulation hit an error', code((e&&e.message)||'Unknown error')+'<br><br>Open the browser console (F12 → Console) and share the first red error.');
  });
  window.addEventListener('unhandledrejection',function(e){
    overlay('The simulation hit an error', code((e&&e.reason)||'Unhandled promise rejection'));
  });
  setTimeout(function(){
    if(window.__simStarted) return;
    if(location.protocol==='file:'){
      overlay('Open this through a web server, not a file',
        'This page is open as a '+code('file://')+' URL, which browsers block from loading ES modules, so nothing runs and the page stays blank.<br><br>'
        +'Serve the folder over HTTP instead. With XAMPP started, open:<br><br>'+code('http://localhost/Simatrix/Module1/'));
    } else {
      overlay('The simulation didn’t finish loading',
        'The page loaded but the 3D module didn’t initialise.<br><br>'
        +'• It needs internet on first load (Three.js loads from a CDN).<br>'
        +'• Open the console (F12) and share the first red error.');
    }
  }, 6000);
})();
</script>

<link rel="stylesheet" href="./src/shell.css"/>
</head>
<body>

<!-- ════════ STEPPER PANEL ════════ -->
<aside id="wizard">
  <div class="wizard-main">
  <section class="step-card" id="step-card" aria-live="off">
    <div class="card__eyebrow-row">
      <p class="eyebrow" id="eyebrow">Step 1 of 5</p>
      <!-- The "Practice problems" entry button is injected here by chrome.js (Module-2 style). -->
    </div>
    <h1 class="step-title" id="step-title">Choose the quadrant</h1>
    <p class="step-lead" id="step-lead"></p>
    <div class="step-body" id="step-body"></div>

    <!-- Static control wrappers; the engine shows only those the step needs -->
    <div class="controls" id="controls">
      <div class="ctrl field" data-ctrl="quad" hidden>
        <label class="field__label" for="sel-q"><span class="field__name">Quadrant</span></label>
        <select id="sel-q" aria-label="Quadrant">
          <option value="Q1">I: above HP, in front of VP</option>
          <option value="Q2">II: above HP, behind VP</option>
          <option value="Q3">III: below HP, behind VP</option>
          <option value="Q4">IV: below HP, in front of VP</option>
        </select>
      </div>

      <div class="ctrl field" data-ctrl="hp" hidden>
        <label class="field__label" for="r-hp"><span class="field__name">Distance from HP</span></label>
        <div class="field__row">
          <input class="field__range" type="range" id="r-hp" min="0" max="100" step="1" aria-label="Distance from HP in millimetres"/>
          <input class="field__num" type="text" id="n-hp" inputmode="decimal" aria-describedby="note-hp" aria-label="Distance from HP, type a value"/>
          <span class="field__unit">mm</span>
        </div>
        <small class="ctrl-note" id="note-hp" role="status" hidden></small>
      </div>

      <div class="ctrl field" data-ctrl="vp" hidden>
        <label class="field__label" for="r-vp"><span class="field__name">Distance from VP</span></label>
        <div class="field__row">
          <input class="field__range" type="range" id="r-vp" min="0" max="100" step="1" aria-label="Distance from VP in millimetres"/>
          <input class="field__num" type="text" id="n-vp" inputmode="decimal" aria-describedby="note-vp" aria-label="Distance from VP, type a value"/>
          <span class="field__unit">mm</span>
        </div>
        <small class="ctrl-note" id="note-vp" role="status" hidden></small>
      </div>

      <div class="ctrl field" data-ctrl="pp" hidden>
        <label class="field__label" for="r-pp"><span class="field__name">Distance from PP (side)</span></label>
        <div class="field__row">
          <input class="field__range" type="range" id="r-pp" min="0" max="100" step="1" aria-label="Distance from Profile Plane in millimetres"/>
          <input class="field__num" type="text" id="n-pp" inputmode="decimal" aria-describedby="note-pp" aria-label="Distance from Profile Plane, type a value"/>
          <span class="field__unit">mm</span>
        </div>
        <small class="ctrl-note" id="note-pp" role="status" hidden></small>
      </div>

      <div class="ctrl" data-ctrl="anim" hidden>
        <button id="btn-anim" class="btn btn-primary" style="width:100%">▶ Animate Unfolding</button>
      </div>
    </div>

    <div class="hint" id="hint" hidden>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
      <span id="hint-text"></span>
    </div>

    <footer class="card__nav">
      <div id="reset-control">
        <button id="btn-reset" class="btn btn--ghost" type="button">Reset</button>
      </div>
      <button id="btn-back" class="btn btn-secondary btn--nav" type="button">Back</button>
      <button id="btn-next" class="btn btn--primary btn--nav" type="button">Next</button>
    </footer>
  </section>

  <ol id="step-rail" aria-label="Lesson steps"></ol>
  </div>
</aside>

<!-- ════════ VIEWPORT ════════ -->
<div id="sim-viewport">
  <div id="canvas-area">
    <canvas id="c3d" role="img" aria-label="3D view of a point projected onto the Horizontal Plane (HP) and Vertical Plane (VP) across the four quadrants. The step instructions and the text summary below describe the result."></canvas>
    <canvas id="c2d" role="img" aria-label="Compare view: the 2D orthographic drawing, or a live 3D view while the sheet is folded flat. Opened on demand from the Compare control."></canvas>
  </div>
  <!-- Mirrors the viewport's computed result as text. The 3D/2D scenes are WebGL
       (unreadable by assistive tech); this is the readable equivalent of where P
       and its views land, updated on every rebuild. -->
  <div id="vp-status" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
</div>

<!-- Inline term popover -->
<div id="term-pop" role="tooltip"></div>

<!-- Mobile notice -->
<div id="mobile-note" role="note">
  <span>The 3D view stays pinned at the top while you scroll through the steps. Use <b>Compare</b> to open the 2D drawing alongside it.</span>
  <button id="mobile-dismiss" class="btn btn-secondary" style="padding:0 var(--space-4)">Got it</button>
</div>

<!-- Live region: announces step changes -->
<div id="live" class="sr" role="status" aria-live="polite"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
